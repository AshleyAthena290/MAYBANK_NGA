  - stepNo: '4'
    screen: Change Source Account (Pop Up)
    userAction: User change the source account (Optional)
    systemBehaviour: |-
      On Page Loads
      System loads the source account listing in a pop up drawer.

      Action/Button Behavior
      Source Account - Tap one of the account to select it and return to previous page.
    businessRules: >-
      Transfer From (Source of Funds):

      1. Retrieve & default to primary account (from Settings > Primary App Account).

      2. User can tap on [Change] to change SoF. IF user changes the SoF account, it will not change/update the default
      SoF for the subsequent transfers.

      3. Transfer From Drawer: 

      a. Retrieve list of user's account based on "Table 1 - SoF Eligibility Check" 

      b. Indicate Primary Account

      3. IF user has only 1 SoF account, [Change] button will be hidden.


      Transfer to OWN account:

      a. User is not allowed to select SoF as the same as receiving account number. If selected SoF is the same as
      receiving account number, system displays toastbar error message "You cannot send money to the same account you're
      transferring from.".
    apis: []
  - stepNo: '5'
    screen: Review & Confirm
    userAction: User reviews details and slide to Confirm
    systemBehaviour: >-
      On Page Loads

      System loads the Confirmation Page.


      Action/Button Behavior

      Change Button - Upon tapping [Change] button, display drawer containing selection of Source of Funds account
      lists.

      Edit (Amount Details) - Redirect to the Input Amount Screen. 

      Edit (Transaction Details) - Redirect to the Input Amount Screen.

      Confirm Button - Upon tapping [NEXT] button, navigate to Transfer details. Refer to Business rules for validation.
      (Refer to the Step No 6)
    businessRules: >-
      Upon tapping [Confirm] button, system performs:

      1. SoF Account eligibility (refer to Local Transfer FSD "Input Amt" > Table 1 - SoF Eligibility Check). If SoF
      account is NOT eligible to perform transfer, system displays toastbar message "This account is unable to make this
      transfer. Select another account."

      2. Minimum amount per Transaction Limit:

      a. Minimum transaction amount (from NGBO, basically is IDR10,000) for selected transfer mode. If does not meet,
      display toastbar error message "Minimum amount is IDR <min limit based on transfer mode>"

      (i) Own

      (ii) Intrabank 

      (iii) Interbank

      3. Daily Limit by Transfer Mode (from Settings) - for INTERBANK & INTRABANK only

      a. If exceeds, display toastbar error message "Amount cannot exceed your remaining limit" 

      4. SoF Balance Checking

      a. If amount > SoF available balance, display toastbar error message "Transaction amount cannot exceed you
      available balance." 

      5. Maximum per Transaction Limit:

      a. Maximum transaction amount for selected transfer mode. If exceed, display toastbar error message "Transaction
      amount cannot exceed your maximum transaction limit for this transfer mode."

      (i) Own

      (ii) Intrabank 

      (iii) Interbank

      6. If all above validation passed, navigate to Status End Screen.
