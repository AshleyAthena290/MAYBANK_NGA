  - stepNo: '6'
    screen: Transfer Result
    userAction: User view the transfer result screen. (S2U Acknowledgement Screen)
    systemBehaviour: >-
      On Page Loads

      System loads the Transfer Result Screen.


      Action/Button Behavior

      Love Button - Upon tapping the Love icon, system to add beneficiary to favourite list and change the Love icon
      black color. (Please refer to the Post_Trf_Add_Fav sheet)

      [View Receipt] button - Upon tapping View receipt, navigate to receipt page. 

      [New Transfer] button - Upon tapping New Transfer, navigate to Transfer Landing Page [Share Receipt] button - Upon
      tapping share receipt, system to generate receipt as an image/PDF (TBC) and trigger device's native share.

      [Done] button - Upon tapping Done, direct to App Dashboard page.
    businessRules: |-
      Upon transfer confirmation, below are the possible status:
      a. Transfer Successful - For a successful transaction posting.
      b. Transfer Scheduled - For a successful scheduled or recurring transaction.
      c. Transfer Processing - For a successful debit but pending credit/status returned from BI-SKN or RTGS.
      d. Transfer Unsuccessful:
      - For Unsuccessful transaction posting.
      - For Unsuccessful scheduled or recurring transaction.
      e. Authorisation failed (refer to [A&A] S2U for:
      - S2U authorisation expired, rejected or failed.
