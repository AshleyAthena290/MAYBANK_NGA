steps:
  - stepNo: '1'
    screen: Input Amount
    userAction: User input amount and ready to toggle on the scheduling/recurring.
    systemBehaviour: >-
      On Page Load

      System loads the Input Amount Page with Source and Beneficiary Details


      Action/Button Behavior

      [Change] button - Upon tapping [Change] button, display drawer containing selection of Source of Funds account
      lists. (Please refer to the immediate transfer sheets)

      Schedule or set recurring [toggle] - Options to trigger scheduling transfer. 

      [Next] button - Upon tapping [NEXT] button, navigate to Transfer details. Refer to Business rules for validation.
    businessRules: >-
      Schedule/ Recurring option:

      1. End Date & No. of Transaction behaviour

      (i) IF user changes the Number of Transaction, system will re-calculate the corresponding end date based on the
      Number of Transactions selected. 

      (ii) IF user returns to End Date tab, system to default & display the newly derived date. 

      (iii) IF user changes the End Date after Number of Transaction is selected, system will re-calculate the
      corresponding Number of Transaction based on the End Date selected.

      (iv) IF user returns to Number of Transaction tab, system to default & display the newly derived value. 


      2. Scheduled/ recurring transaction is NOT applicable for (hide "Schedule or set recurring" Toggle field):

      a. Interbank transfer FCY to IDR

      b. Intrabank transfer with FCY, i.e. IDR to FCY, FCY to IDR, FCY to same FCY & FCY to xFCY.

      c. Own & Intrabank - beneficiary account is Virtual Account

      d. Own & Intrabank - beneficiary account is IBAAS Account (Islamic Banking as a Service)


      This sheet will only focus on scheduling, for other business rules please refer to immediate transfer sheets.
