  - stepNo: '7'
    screen: Transfer - Recipients - Add to Favorite
    userAction: Add to favorites from ALL
    systemBehaviour: Add to favorites from ALL
    businessRules: >-
      1. Upon tapping [Save] button:

      a. If the beneficiary is added to "Favourites" list, S2U is required.

      b. If the beneficiary is added to Custom list only, S2U is not required.

      c. Combination of list selection which includes Favourites, S2U is required.

      d. If beneficiary is already in Favourites and is now added to Custom list, S2U is not required.

      e. If none of the Fav or Custom list is selected, display toastbar error message "Please select an option to
      proceed."

      2. For adding to favourites/custom list:

      a. If action requires S2U, display Status End Screen as a result.

      b. If action does not require S2U, display toastbar message. For successful addition, system displays "List
      added."

      c. Combination of favourite and custom add to list will always result Status End screen as this requires S2U
      authorisation.

      3. For successful attempt:

      - recipient will be added to the selected Fav/Custom tabs

      4. For unsuccessful attempt:

      - If S2U required and failed to save, display Update unsuccessful screen.

      - If S2U is not required and failed to save, display toastbar error message "Service temporarily unavailable".


      Notes:

      - M2U/RMBP Favourite List will be synced with NGA Favourites list and displayed in NGA.
