steps:
  - stepNo: '1'
    screen: Transfer - Add Recipient
    userAction: Create new favorite custom group with with recipients
    systemBehaviour: Create new favorite custom group with with recipients
    businessRules: >-
      At Create New List Screen, user is required to enter the List Name.

      To add recipient(s), user is required to tap [(+) Add recipient] button, system to display select recipient
      drawer:

      1. Single tap will mark and highlight the recipient with a checkbox ticked. 

      2. Multiple recipients selection is supported.

      3. Re-tapping recipient will de-select and uncheck recipient.

      4. Tap [Save] to confirm the selection. Selected recipients will be moved to Create New List Screen.


      Upon tapping [Add] button:

      1. If no selected recipient(s), system displays toastbar message "Please select at least 1 recipient."


      Upon tapping [Create list] button, system performs:

      1. Mandatory checking. If List name is empty, system displays inline error message "Required field."

      2. Duplication checking, list name cannot be the same as other existing custom list AND default list (All,
      Frequent, Own, Favourite). System display inline error message: "Name cannot be the same as existing lists."

      3. IF there is no recipient(s), system displays toastbar message "Please select at least 1 recipient."

      4. There is no limit to the maximum recipient(s) in a single custom list.


      Upon succesful creation, system to display a toast message "List Updated" and Custom List is created & placed in
      the right most tab. System then navigates to the newly created custom beneficiary category tab.
    apis:
      - name: addBeneficiaries
        method: POST
        endpoint: /v1/external/transfer
        testCaseId: TC_RECIP_001a
        requestSample:
          groups:
