steps:
  - stepNo: '1'
    screen: Scheduled/Recurring Transfer Listing
    userAction: |-
      User opens Scheduled Transfers page from the submenu of the transfer dashboard (Entry Point 1)

      User opens Scheduled Transfers page from the Settings (Entry Point 2)
    systemBehaviour: >-
      On Page Loads

      Load the list of scheduled transfer from SI.


      Default to Individual tab and display a list of active scheduled & recurring individual transfers. 


      Action/Button Behavior

      Individual/Batch Tabs - Option to switch between individual (single transaction) or batch (bulk transaction) (For
      this journey, we will be covering only Individual)

      Search Bar - Refer to Business Rules.

      Filter Icon - Display the filter screen. (Refer to Step 2)

      Scheduled Transfer Cards - Tap on the cards to view further details regarding to the scheduled transfer. (Refer to
      Step 3)
    businessRules: |-
      For searching scheduled/recurring transactions:
      a. Searching will be based on the selected Tab (Individual or Batch).
      b. Support wildcard search by entering minimum 3 characters.
      c. Searching criteria:
      (i) Individual Tab:
      - Beneficiary Name
      - Amount
      (ii) Batch Tab:
      - Batch Name
      - Amount
      c. Display listing:
      (i) Sort & display nearest scheduled transaction date (Transfer Date or Start Date) first.
      (ii) In the event transaction date is same, sorting is based on date created (earliest to latest).
      d. If searching returns empty, display "We could not find a match" screen.
