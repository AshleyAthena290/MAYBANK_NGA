  - stepNo: '2'
    screen: Filtering tools for Scheduled/Recurring Transfer Listing
    userAction: User is able to filter the list of scheduled transfers through the filtering tools.
    systemBehaviour: |-
      On Page Loads
      Load the filtering options.

      Action/Button Behavior
      Accounts - User is allow to filter based on source account of the scheduled transfer.
      Frequency - User is allow to filter based on the frequency type of the scheduled transfer.
    businessRules: There will be no API needed to be called here, the FE will handles the filter.
    apis:
      - name: GetScheduledDetails
        method: GET
        endpoint: pt/recurring/v1/external/transfer/{transactionRefId}
        testCaseId: TC_MSCHED_002a
        requestSample: null
        responseSample:
          status: '200'
          message: Success
          timestamp: '2026-05-20T09:30:15'
          correlationId: d9b2d63d-a233-4123-8478-316827018c1e
          meta: null
          data:
            transactionRefId: PNT260520A1B2C3D4E5
            creditAccountName: JOHN DOE
            creditAccountNo: '0987654321'
            creditAccountBankName: Bank CIMB Niaga
            debitAccountName: SAVINGS ACCOUNT
            debitAccountNo: '1234567890'
            amount: 1000
            currency: IDR
            frequencyCode: MONTHLY
            startDate: '2026-01-01'
            endDate: '2026-12-01'
            numberOfTimes: 12
            status: SCHEDULED
          error: null
        mapping: null
        microservice: pt-recurring-management
        businessContext: >-
          Cancellation of Scheduled/Recurring Transaction:

          1. Upon tapping [Cancel] at Scheduled/Recurring transaction details,

          a. IF Transaction Frequency = Just Once. 

          - System to prompt confirmation message "Cancel Scheduled Transfer?" with message"The scheduled transfer to
          this recipient will be stopped and no longer processed. You need to start a new transfer to set it up again."

          b. IF Recurring, i.e. Transaction Frequency = Weekly or Monthly. 

          - System to prompt confirmation message "Cancel recurring transfer?" with message "Any recurring transfer to
          this recipient will be stopped and no longer processed. You need to start a new transfer to set it up again."


          2. Upon tapping [Cancel] at Scheduled/Recurring transaction details, and is closer to scheduled date,

          a. IF Transaction Frequency = Just Once. 

          - [Cancel] buttton is hidden. System displays blue box notes "This transfer is already being processed."

          b. IF Recurring, i.e. Transaction Frequency = Weekly 

          - System to prompt confirmation message "Cancel recurring transfer?" with message "Your transfer for this week
          is already being processed. Cancelling will only stop future recurring transfers. You may start a new pament
          to set it up again."

          c. IF Recurring, i.e. Transaction Frequency = Monthly

          - System to prompt confirmation message "Cancel recurring transfer?" with message "Your transfer for this
          month is already being processed. Cancelling will only stop future recurring transfers. You may start a new
          pament to set it up again."


          3. Upon tapping [Cancel] button at Confirmation message, system to navigate to S2U authorisation screen.

          4. Upon successful S2U authorisation, system will canel & remove upcoming scheduled transaction or recurring
          transactions instruction (remove the series), navigate to Status End Screen. 

          a. If successful, display "Scheduled transfer cancelled" or "Recurring transfer cancelled".

          b. If failed, display "Update unsuccessful"


          For the full details regarding to the closer date calculation, please refer to the FSD.
        downstream: >-
          ESB:TerminateRecurring(Transfer) (Please refer to ESB Payment Transfer ESB Mapping Excel, Sheet:
          TerminateRecurring(Transfer))
        remarks: For the ESB, pending on the SI side to provide downstream API to support viewing the details.
