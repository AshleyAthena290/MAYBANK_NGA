  - stepNo: '2'
    screen: Bank list
    userAction: User selects the internal bank (Maybank)
    systemBehaviour: >-
      On Page Loads

      Display the List of Banks (Please refer to the next column for the listing criteria)


      Action/Button Behavior

      List of Banks - Tapping on Maybank will start the Intrabank Transfer Journey 


      Search Bar - Wildcard Bank search on Bank Name will be performed once user has entered 3 characters(Please refer
      to the next column for the searching criteria).
    businessRules: >-
      "Transfer to/Select Bank drawer"" Category Tabs

      1. Search & Listing - Wildcard Bank search on Bank Name will be performed once user has entered 3 characters. 

      2. Search to include alias/tags (to be maintained in NGBO - Bank List). E.g. user types ""Bank Central"" or
      ""BCA"", system will match and list Bank Central Asia. 

      3. Listing will be displayed as below:

      a. Maybank will be first in list.

      b. Banks - list top 10 banks and follow by remaining bank list sorted in ascending order (A-Z, 0-9). 

      4. Banks with status = Offline (configured in NGBO)

      a. Display label ""Service offline"" (without affecting the sorting & display sequence).

      b. Selection is disabled.

      5. If search returns empty, display "We couldn't find a match for <input value>".
