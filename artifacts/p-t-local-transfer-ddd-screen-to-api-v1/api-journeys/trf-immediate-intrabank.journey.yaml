  - stepNo: '3'
    screen: Enter Account No
    userAction: User enters account no
    systemBehaviour: |-
      On Page Loads
      Display the Input Account Number Page

      Action/Button Behavior
      Transfer [X] icon - Upon tapping [X], discard input and navigate to Transfer Landing Page.
      [Next] button - Upon tapping [Next], navigate to Input Amount screen.
    businessRules: >-
      Field Validation

      Transfer to

      1. Pre-populated with selected Bank from Transfer to drawer.

      2. If a new bank is selected, system clears the account number field.


      Refer to Business Rules in Step 2 for details.

      Account Number:

      1. Upon tapping, system draws up phone's numeric keypad.

      2. Upon tapping on Done on keypad, account number will be formatted & displayed.

      4. Paste is supported for numeric only. Pasted alphabets and special characters will be removed from the field and
      show only the numeric values.

      5. For Maybank, accepts both CASA & VA. 


      Business Rule:

      Intrabank

      1. Via [+Transfer], at "Input Acct No" page, when tap on [Next]:

      a. Perform fields validation.

      - If account number field is empty, display inline error message "Required field".

      b. Perform an inquiry to check Account Type & retrieve Beneficiary Name. 

      - If invalid account, display inline error "Please enter a valid account number"

      c. If Bene Account Type = GAA, system to display "Select currency drawer", select currency option to proceed. If
      Bene Account Type is not GAA, skip this step.

      d. Display Input Amount page.
    apis: []
  - stepNo: '4'
    screen: Input Amount
    userAction: User enters amount
    systemBehaviour: >-
      On Page Load

      System loads the Input Amount Page with Source and Beneficiary Details


      Action/Button Behavior

      [<] icon - 

      Upon tapping back [<] icon:

      1. Redirect back to input account number if previous entry point was new transfer (manual input).

      2. Redirect back to Transfer Landing Page if previous entry point was from bene list.

      [X] icon - Upon tapping [X], exit and redirect user to the Transfer Landing Page

      [Change] button - Upon tapping [Change] button, display drawer containing selection of Source of Funds account
      lists. Schedule or set recurring [toggle] - Options to trigger scheduling transfer, (Not covered in this scope)

      [Next] button - Upon tapping [NEXT] button, navigate to Transfer details. Refer to Business rules for validation.
    businessRules: >-
      Transfer Amount - Remaining Limit:

      a. New Transfer & Bene Listing

      When entering amount, to check if remaining user daily limit (include the entered amount) hits > 70% of the
      defined limit (Settings > Intrabank Transfer):

      (i) "IDR - IDR" 

      - display "Remaining limit IDR 999,999" with Manage limit hyperlink (refer to screen).

      (ii) "IDR - FCY" & "FCY - IDR" 

      - to calculate remaining limit using latest FOREX and display in IDR. 

      (ii) "FCY - FCY", "FCY - xFCY" 

      - xxx


      Transfer Amount - Account Limit Checking:

      System to display notes above amount field for below, but able to proceed:

      a. If transaction amount exceeds user's daily remaining limit, display "Amount cannot exceed your remaining
      limit".

      b. If transaction amount exceeds SoF Account Balance, display "Amount should not exceed your account balance.".


      When tap [Next] to proceed, perform validation:

      1. Fields validation & all validation mentioned above

      2. SoF Account eligibility (refer to Table 1 - SoF Eligibility Check). If SoF account is NOT eligible to perform
      transfer, system displays toastbar message "This account is unable to make this transfer. Select another account."

      3. Minimum per Transaction Limit:

      a. Minimum transaction amount (from NGBO, basically is IDR10,000) for all transfer mode. If does not meet, display
      inline error message "Minimum amount is IDR <min limit based on transfer mode>"


      4. Daily Limit by Transfer Mode (from Settings) 

      a. If exceeds, display warning message "Amount cannot exceed your remaining limit" (but can proceed).


      5. SoF Balance Checking

      a. If amount > SoF account balance, display warning message "Amount should not exceed your account balance." (but
      can proceed)


      6. If user tap [Next] button while not resolving the error, displays toastbar error message "Please resolve all
      errors to proceed".


      Once successful, system to redirect to Transfer Details screen.
