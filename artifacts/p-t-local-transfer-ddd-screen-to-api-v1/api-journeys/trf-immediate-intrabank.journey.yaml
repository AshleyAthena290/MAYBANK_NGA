  - stepNo: '5'
    screen: Change Source Account (Pop Up)
    userAction: User change the source account (Optional)
    systemBehaviour: |-
      On Page Loads
      System loads the source account listing in a pop up drawer.

      Action/Button Behavior
      Source Account - Tap one of the account to select it and return to previous page.
    businessRules: >-
      Transfer From (Source of Funds):

      1. Retrieve & default to primary account (from Settings > Primary App Account).

      2. User can tap on [Change] to change SoF. IF user changes the SoF account, it will not change/update the default
      SoF for the subsequent transfers.

      3. Transfer From Drawer: 

      a. Retrieve list of user's account based on "Table 1 - SoF Eligibility Check in Local Transfer Journey FSD" 

      b. Indicate Primary Account

      3. IF user has only 1 SoF account, [Change] button will be hidden.
    apis: []
  - stepNo: '6'
    screen: Transfer Details
    userAction: User input the remark and recipient email (Optional)
    systemBehaviour: >-
      On Page Loads

      System loads the Transfer Details Page with Source Account Details.


      Action/Button Behavior

      [<] icon - Upon tapping back [<] icon, redirect back to Input Amount screen.

      [X] icon - Upon tapping [X], redirect to Transfer Landing Page


      [Next] button - Upon tapping [Next], system to redirect to confirmation screen. Refer to business rules for more
      details.
    businessRules: >-
      Upon tapping [Next], perform validation:

      1. Fields validation checking & all validation mentioned above. 

      - "Invalid Account", display toastbar error message: "Please enter a valid account number"

      2. If validation passed, system to redirect user to Confirm screen.


      For FCY:

      1. IF [INTERBANK] FCY to IDR and amount > USD 10,000., system to redirect to Additional Details screen.

      2. IF [INTRABANK] with FCY (Non-LCS) and amount > USD 10,000 or equivalent in other currencies, system to redirect
      to Additional Details screen.

      3. IF [INTRABANK] with FCY (Non-LCS) and transaction amount > USD 50,000 or equivalent in currencies per Month,
      system to redirect to Additional Details screen.
    apis: []
