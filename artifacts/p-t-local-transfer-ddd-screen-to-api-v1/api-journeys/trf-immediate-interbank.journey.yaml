  - stepNo: '5'
    screen: Transfer Details
    userAction: User choose the transfer mode, input all the relevant required fields.
    systemBehaviour: >-
      On Page Loads

      System loads the Transfer Details Page based on the Transfer Modes.


      BI-FAST:

      Purpose Of Transfer

      Remark

      Recipient Email


      RTOL:

      Remark

      Recipient Email


      BI-SKN & RTGS:

      Source Of Fund

      Purpose Of Transfer

      Account Holder Name

      Recipient Type

      Recipient Citizenship

      Remark

      Recipient Email


      Action/Button Behavior

      [<] icon - Upon tapping back [<] icon, redirect back to Input Amount screen.

      [X] icon - Upon tapping [X], redirect to Transfer Landing Page

      Transfer Mode - Upon tapping selection, to display Transfer Mode drawer .

      Transfer Mode Learn More hyperlink (BI-SKN/RTGS) - Upon tapping [hyperlink], to display transfer mode detailed
      information.

      [Next] button - Upon tapping [Next], system to redirect to confirmation screen. Refer to business rules for more
      details.
    businessRules: >-
      Upon page load:

      1. Transfer Mode: 

      a. For New Transfer

      (i) Transfer Mode will be populated from previous screen ( Input Account No).

      (ii) If the Transfer Mode is offline, then default to first available Transfer Mode based on the Transfer Mode
      sequence, and display warning message "<Default Transfer Mode> is temporarily offline. Please review the transfer
      mode before continuing."

      b. For Bene Listing

      (i) Transfer Mode will be populated from previous screen ( Input Amount)

      (ii)If the Transfer Mode is offline, then default to first available Transfer Mode based on the Transfer Mode
      sequence, and display Info Message "The transfer mode previously selected for this recipient is temporarily
      offline. Please review before continuing." 


      Upon tapping [Next], perform validation:

      1. Fields validation checking & all validation mentioned above. 

      2. IF selected transfer mode is BI-FAST or Transfer Online, system performs account number inquiry based on
      selected Transfer Mode.

      - "Invalid Account", display toastbar error message: "Please enter a valid account number"

      - IF BI-FAST or RTOL networks return timeout, display toastbar message "The service is temporarily unavailable.
      Please try again later or try another transfer mode."

      3. IF selected transfer mode is BI-SKN or RTGS, Account Holder name will be availed for user input, with
      previously inquired Beneficiary Name pre-populated if any. 

      4. If validation passed, system to redirect user to Confirm screen.
    apis: []
