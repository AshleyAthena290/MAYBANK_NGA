      Frequent, Favourite, Own, Custom) regardless which beneficiary category tab the user is at. (search whole DB - not
      just what is displayed on screen).

      3. For search result that matched, display list of Beneficiaries in ascending order (A-Z, 0-9) in the below order,
      without max records. Lazy load is available.

      - Beneficiary Name 

      - Beneficiary Bank Name 

      - Account Number

      4. For search result that returns EMPTY:

      a. System to display "We couldn't find a match for <input data>" with information (refer to screen).

      b. IF contacts are synced with NGA, system to perform search on Contact's First Name & Last Name. Display Section
      "Contacts" and the list of contact name & phone number, with Avatar (Contact Name's Initial). 

      c. IF contacts are not synced with NGA, or no contact is matched, system to NOT display "Contacts" section.

      5. At the bottom of screen, display "Make a new transfer instead?" section, and display icon & Account Number.
      Tapping on Account Number will navigate to Input Account Number.
