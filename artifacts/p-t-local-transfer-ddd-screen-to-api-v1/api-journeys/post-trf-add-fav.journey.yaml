steps:
  - stepNo: '1'
    screen: Transfer Result
    userAction: |-
      User view the transfer result screen. (S2U Acknowledgement Screen)

      User can add the user as favourite here with the love button.
    systemBehaviour: >-
      On Page Loads

      System loads the Transfer Result Screen.


      Action/Button Behavior

      Love Button - Upon tapping the Love icon, system to add beneficiary to favourite list and change the Love icon
      black color. 

      [View Receipt] button - Upon tapping View receipt, navigate to receipt page. (Please refer to the immediate
      transfer journey sheets.) 

      [New Transfer] button - Upon tapping New Transfer, navigate to Transfer Landing Page. (Please refer to the
      immediate transfer journey sheets.) 

      [View interaction] button - Navigate to Realtime chat and Scan near me module. (further details pending to be
      covered) [Share Receipt] button - Upon tapping share receipt, system to generate receipt as an image/PDF (TBC) and
      trigger device's native share. (Please refer to the immediate transfer journey sheets.) 

      [Done] button - Upon tapping Done, direct to App Dashboard page.
    businessRules: >-
      Adding to favourite:

      1. Tapping love icon will add beneficiary to favourite. As a result, heart shape will be filled with a full black
      color. Retapping on black heart will remove the added beneficiary from favourite. No maximum attempts. S2U is not
      required.

      2. For Transfer to Beneficiary that is already a favourite, love icon is hidden.

      3. For Transfer to Maybnak's one-off VA account (closedPayment flag), heart icon is hidden.


      As this current sheet, we will only focus on the adding favourites on post transfer, other screen behaviors and
      rules can be referred by to the immediate transfer sheets.
