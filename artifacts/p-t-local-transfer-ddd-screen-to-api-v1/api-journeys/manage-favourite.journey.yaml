  - stepNo: '5'
    screen: Manage Favorite - Add from Frequent
    userAction: Add Favorite from Frequent
    systemBehaviour: Add Favorite from Frequent
    businessRules: >-
      Search Bar:

      1. Wildcard search will be performed once the user has entered 2 characters (key up). Searching of beneficiaries
      include fields below:

      a. Beneficiaries Account Name

      b. Beneficiaries Nickname

      c. Beneficiaries Account Number

      d. Beneficiaries Bank Name.

      2. Listing of beneficiary will be the same as Transfer Landing Page ALL tab. Refer to Trf - Landing Page.

      3. For search result that returns EMPTY:

      a. System to display "We couldn't find a match for <input data>" 


      Upon tapping a beneficiary:

      1. If beneficiary is not a favourite, system displays "Add Recipient" as screen header. User to key in nickname or
      leave the field empty.

      2. If beneficiary has a nickname, system displays "Edit Nickname". User is able to edit current beneficiary's
      nickname.


      Upon tapping [Next]

      1. for a non-favourite beneficiary, navigate to S2U.

      2. for an existing favourite:

      a. IF no changes on nickname, display toastbar message "This recipient has already been added as favourite."

      b. IF there are changes on nickname, navigate to S2U.
