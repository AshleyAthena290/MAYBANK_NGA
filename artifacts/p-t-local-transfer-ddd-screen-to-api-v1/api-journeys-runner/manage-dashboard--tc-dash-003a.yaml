      (ii) Entity name 

      (iii) Account number

      c. There is no maximum limit in favourite beneficiaries. 

      d. Lazy load is available.

      e. User will be able to remove a beneficiary from Favourite list. Details of beneficiary removal will be explained
      in respective section. 

      f. IF list is empty, system to display "No recipients yet" with information (refer to screen Dashboard - Empty
      State).


