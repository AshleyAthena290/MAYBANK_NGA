request:
  method: PATCH
  url: /v1/external/accounts/nickname
  endpoint: /v1/external/accounts/nickname
  headers:
    Accept: application/json
  body:
    accountId: '504233415671'
    nickname: MUTHU
response:
  successStatusCode: 200
  sampleResponse:
    status: 200
    message: update_nickname_success
    timestamp: '2026-01-13T12:00:00'
    correlationId: abc123-correlation-id
    meta:
      provider: erp
assertions:
  - description: Status code equals 200
    type: status
    expectedValue: 200
  - description: >-
      Validate business outcome: Upon entering Nickname:

      1. If user enter OR paste other than allowable characters, display inline error message "only alphabets, digits,
      and spaces are allowed."

      2. If user cleared the nickname with empty value, [Save] button will be changed to [Remove]. 

      3. If user enter valid value, proceed to save and once successful, redirect user to the last active tab and
      display a successful toast message "Nickname updated".

      4. If user tap on [Remove], delete the nickname and once successful, redirect user to the last active tab and
      display a successful toast message "Nickname removed".

      5. Nickname update will be reflected across the other tabs (Frequent, Fav or Custom) i.e. 1 beneficiary will only
      have 1 nickname.

      6. For unsuccessful update or removal, system to redirect user to the last active tab and display a successful
      toast message "Service Temporary unavailable".
    type: custom
