assertions:
  - description: Status code equals 200
    type: status
    expectedValue: 200
  - description: >-
      Validate business outcome: When tap [Next] to proceed, perform validation:

      1. Fields validation & all validation mentioned above

      2. SoF Account eligibility (refer to Table 1 - SoF Eligibility Check in the Local Transfer FSD). If SoF account is
      NOT eligible to perform transfer, system displays toastbar message "This account is unable to make this transfer.
      Select another account."

      3.Minimum per Transaction Limit:

      a. Minimum transaction amount (from NGBO, basically is IDR10,000) for all transfer mode. If does not meet, display
      inline error message "Minimum amount is IDR <min limit based on transfer mode>"

      (i) Own

      (ii) Intrabank 

      (iii) Interbank

      4. Daily Limit by Transfer Mode (from Settings) 

      a. If exceeds, display warning message "Amount cannot exceed your remaining limit" (but can proceed).

      b. Applies to Intrabank & Interbank (BI-FAST, RTOL, BI-SKN, RTGS) only. 

      5. SoF Balance Checking

      a. If amount > SoF account balance, display warning message "Amount should not exceed your account balance." (but
      can proceed)

      5. Maximum per Transaction Limit:

      a. Interbank - it is not allowed to transfer more than USD 50k. System displays "Maximum amount is USD 50,000."
      (To confirm if this is required since it would have exceeded Payment Rail's max limit)

      - use Counter Rate (from Trapi) for conversion to USD.

      5. Special rate validation checking (if applied). IF outside validation period, system to display "Special rate
      not available" pop up.

      6. If user tap [Next] button while not resolving the error, displays toastbar error message "Please resolve all
      errors to proceed".


      Once successful, system to redirect to Transfer Details screen.
    type: custom
