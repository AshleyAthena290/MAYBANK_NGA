assertions:
  - description: Status code equals 200
    type: status
    expectedValue: 200
  - description: >-
      Validate business outcome: Display criteria for ALL list are:

      a. Beneficiaries consist combination of:

      - Successful transactions within the past 90 days via RMBP & M2U Web (applicable for user migrated to NGA). Past
      90 days is from the day user onboard to NGA.

      - All successful transaction in NGA to date.

      - Virtual Accounts (display for recurring VA only, check isClosedPayment flag to identify if is one off VA or
      recurring).

      - EXCLUDE "Transfer to Own".

      b. Beneficiaries will be sorted in ascending order (A-Z, 0-9) in the below order:

      (i) Beneficiary name (if has nickname value, then these will be further sorted at the top with nickname in
      ascending order)

      (ii) Entity name 

      (iii) Account number

      c. Lazy load is available.

      d. User will be able to remove a beneficiary from ALL list. Details of beneficiary removal will be explained in
      respective section.

      e. IF list is empty, system to display "No transfers yet" with information (refer to screen Dashboard - Empty
      State).
