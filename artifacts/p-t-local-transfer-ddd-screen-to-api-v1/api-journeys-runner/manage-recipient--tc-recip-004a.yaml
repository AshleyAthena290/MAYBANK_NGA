  - description: >-
      Validate business outcome: Upon entering nickname:

      1. If user enter OR paste other than allowable characters, display inline error message "only alphabets, digits,
      and spaces are allowed."

      2. If user sets the nickname with empty value and tap [Save] button, proceed to save with no value.

      3. If user enter valid value, proceed to save and once successful, redirect user to the last active tab and
      display a successful toast message "Nickname added".

      4. Saved nickname will be reflected across the other tabs (Frequent, Fav or Custom) i.e. 1 beneficiary will only
      have 1 nickname.

      5. For unsuccessful creation, system to redirect user to the last active tab and display a successful toast
      message "Service Temporary unavailable".
