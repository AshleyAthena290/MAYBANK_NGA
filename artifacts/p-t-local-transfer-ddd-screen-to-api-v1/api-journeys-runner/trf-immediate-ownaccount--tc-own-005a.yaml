stepNo: '5'
screen: Review & Confirm
userAction: User reviews details and slide to Confirm
request:
  method: POST
  url: pt/intrabank/v1/external/initiate
  endpoint: pt/intrabank/v1/external/initiate
  headers:
    Accept: application/json
  body:
    preCheckId: 59c47913-6f73-4aea-81f3-0ddbe83ec5f4
    transferType: OWN_ACCOUNT_TRANSFER
    debitAccountNo: '1234567890'
    debitAccountType: SA
    debitAccountCurrency: IDR
    creditAccountNo: '0987654321'
    creditAccountType: SA
