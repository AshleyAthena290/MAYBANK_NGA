assertions:
  - description: Status code equals 200
    type: status
    expectedValue: 200
  - description: >-
      Validate business outcome: Upon page load, the default beneficiary lists will be set at Frequent Beneficiary
      Category.


      Display criteria for FREQUENT Lists are:

      a. Beneficiaries of which the transactions are successful for at least 2 times in the past 90 days (in Digital
      Transaction - performed via NGA & RMBP & M2U Web), for all transfer mode EXCEPT "Transfer to Own".

      b. Beneficiaries will be sorted in below order:

      - most to least transaction frequency,

      - if same frequency, it will be display in no particular order.

      c. Maximum number of beneficiaries to display is 10.

      d. User is able to remove a beneficiary from the list. Details of beneficiary removal will be explained in
      respective section.

      e. IF list is empty, system to display ""No frequent transfers yet"" with information (refer to screen)."
    type: custom
