  - stepNo: '1'
    screen: Register with Debit / Credit Card
    userAction: User Input Debit / Credit Card Details and click Next
    systemBehaviour: System to Get TPK for PIN encryption during on Load
    businessRules: >-
      "When tap on Next button, perform validation below:

      1. Mandatory Check. If mandatory field empty, display inline error ""Required input.""

      2. Format validation, if failed display inline messsage. 

      3. M2U or NGA User ID validation

      - check if customer has existing M2U/NGA user ID. If yes, then navigate to Forgot Account Details Page.

      4. Account validity , if failed display snackbar error

      a. Credit card

      i. Validate card number, expiry date, PIN validity, else display snackbar error ""Invalid card details or status.
      Please check your details or try another card."" 

      ii. Validate card with following rules, else display snackbar error ""Invalid card details or status. Please check
      your details or try another card."":

      - CC Status allowed = Active (1) dan Inactive (2, i.e. no trxn in last 180 days) 

      - CC Block code allowed = Normal (Null or ” “) or Late Payment (B, C, H, I, J, K, M, N, O, P)

      - CC Card Type = Primary (PP)

      b. Debit card

      i. Validate card number,expiry date, PIN validity, else display snackbar error ""Invalid card details or status.
      Please check your details or try another card."" 

      ii. Check card with following rules, else display snackbar error ""Invalid card details/status. Please check your
      details or try another card.""

      - Debit Card status allowed : Active (1,6)

      - Debit Card relationship code not allowed: Joint Account (02, 32, 03, 33)

      - CASA status allowed: Active or Inactive (IM07, ST01)

      5. IF user enter invalid PIN only >3 times, card will be temporary blocked.


      Once above is completed successfully, perform CIF retrieval and extract info below:

      1. Customer Name (To populate first name for Nickname screen)

      2. DOB (For password check)
