        businessContext: >-
          OTP Box

          1. Copy and paste is not allowed


          OTP Countdown Timer

          1. Upon screen entry, start countdown timer from the defined duration of OTP validity set (e.g., 3 minutes) in
          back office

          2. After countdown finishes, display ("OTP timeout.") and Resend OTP link

          3. If Resend OTP is tapped, redisplay the countdown timer and reset the m:ss


          Resend OTP

          1. Max allowable resend for OTP request is configure in back office which includes the initial from previous
          request page


          OTP Validation

          1. OTP Validity

          - Each OTP sent will expire after 3 minutes. If last expired OTP used, display inline error ("Please enter a
          valid OTP.")

          - If OTP is resent, old OTP becomes invalid

          - If input is less than 4 digits and tap Enter (✓), this won't be counted as an invalid attempt and display
          inline error ("Please enter a valid OTP.')

          2. Submit OTP

          - Max 3 attempts for OTP input; 

          - If incorrect OTP is submitted then red outline on OTP boxes and show snackbar ("Incorrect OTP. Your account
          will be locked after [Remaining attempt] more unsuccessful attempt.") and clear OTP field

          - If 3rd attempt failed, account will be locked and user navigated to the lock account screen

          - Successful validation will land customer to the transaction result page indicating success [Refer to 1.5 S2U
          - Result]


          Locked account

          1. For locked account, Account Locked screen will be displayed (refer to [1.6 Account Locked])
