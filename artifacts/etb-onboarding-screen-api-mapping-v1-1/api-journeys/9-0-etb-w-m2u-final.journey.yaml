    businessRules: |-
      Entry point:
      1. User is navigated to With M2U ID Final Screen after onboarding setup process.

      Final screen state:
      1. Retrieve onboarding status from backend.
      2. If primaryAccountStatus failed OR biometricStatus failed, display final screen “You’re logged in!”.
      3. If coolingOffRequired = true and cooling-off is still active, display “Secure2U activation in progress”.
      4. If setup is successful and there is no active cooling-off, display “You’re all set!”.

      Cooling-off display:
      1. If cooling-off is active, calculate remaining time using cooldownEndAt.
      2. Display real-time countdown in H:MM:SS format.

      Button action:
      1. When user taps primary button, navigate to App Dashboard.
