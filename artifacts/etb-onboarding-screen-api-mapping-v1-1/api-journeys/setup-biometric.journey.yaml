steps:
  - stepNo: '1'
    screen: Open Biometric Setup During Onboarding
    userAction: User Setup Biometric
    systemBehaviour: ''
    businessRules: >-
      Entry point:

      1. Setup Biometric is triggered during onboarding after Primary Account setup.

      2. Post-onboarding biometric setting is managed via Settings screen only.

      3. If device does not support biometric or biometric is not configured at OS level, this screen cannot be
      triggered.


      Proceed button:

      1. Upon proceeding, trigger device-native biometric permission / authentication.

      2. If native biometric is disabled, navigate user to native device Settings screen to enable OS-level biometric.


      Native biometric authentication:

      1. If user taps Don’t Allow, close permission screen and return to Enable Biometric screen.

      2. If user allows, open native biometric authentication.

      3. Android supports face and fingerprint based on device capability.

      4. iOS supports Face ID.

      5. Attempt count follows native device biometric attempt limit.

      6. If biometric authentication fails and reaches native max attempt, navigate to unsuccessful status screen.

      7. If user cancels authentication, return to Enable Biometric screen.

      8. If authentication succeeds, continue biometric registration.

      9. If biometric setup fails due to system error, navigate to unsuccessful status screen.
